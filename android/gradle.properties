org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 内存紧张时并行会成倍放大峰值占用，反而更慢
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.caching=true

# 关闭 release 的 R8 混淆与资源压缩。
# Flutter 的 Gradle 插件读这个开关（FlutterPluginUtils.shouldShrinkResources），
# 默认 true 会给 release 打开 minify，导致 shared_preferences 这类带 Pigeon +
# suspend 的插件在运行期找不到被裁掉的 kotlin 协程类：
#   NoSuchMethodError: SharedPreferencesApiRegistrar.getAll(...Continuation;)
#   ClassNotFoundException: kotlin/coroutines/intrinsics/CoroutineSingletons
# 代价是包体增加约 1-2MB，换来插件稳定可用。
# 若将来要重新开启，需要为第三方插件补齐 keep 规则并逐类验证。
shrink=false
