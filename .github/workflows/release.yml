name: Release APK

# 打 tag 时自动构建并发布到 Releases；也可在 Actions 页手动触发。
# 配了签名 Secrets 就用正式 keystore，否则退化为 debug 签名（仅限测试）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.0，需已存在）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/dailyq-release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=dailyq-release.jks"
            } > key.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
            echo "本次使用正式 keystore 签名"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
            echo "::warning::未配置签名 Secrets，本次为 debug 签名，不能覆盖已安装的正式版"
          fi

      - name: 构建 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 校验并整理产物
        id: pack
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          NAME="DailyQ-${VERSION}-arm64.apk"
          cp "$APK" "$NAME"
          SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "SHA-256: \`$SHA\`"
            echo ""
            echo "签名：$([ "$SIGNED" = release ] && echo '正式 keystore' || echo 'debug（仅供测试，无法覆盖正式版）')"
            echo "架构：arm64-v8a"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DailyQ ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.name }}
          body: |
            SHA-256: `${{ steps.pack.outputs.sha }}`
            架构: arm64-v8a
            签名: ${{ env.SIGNED == 'release' && '正式 keystore' || 'debug（仅供测试）' }}
